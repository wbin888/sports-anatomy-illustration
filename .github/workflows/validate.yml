name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install Pillow
      - run: python skills/sports-anatomy-illustration/scripts/check_movement_spec.py --strict
      - run: python tests/test_movement_spec.py
      - run: python tests/test_init_project.py
      - run: python tests/test_mechanism_graph.py
      - run: python tests/test_illustrator_runtime.py
